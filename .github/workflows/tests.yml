name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (offline, no Oura credentials)
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile oura_self_analysis.py local_enrichment.py health_analytics.py drive_upload.py dashboard_server.py scripts/dashboard_service.py scripts/install_launch_agent.py
      - name: Frontend JavaScript syntax checks
        run: |
          node --check dashboard/app.js
          node --check dashboard/sw.js
